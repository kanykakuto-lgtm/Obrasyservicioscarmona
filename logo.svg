<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Reformas Garrido">
  <defs>
    <linearGradient id="rg-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4631f"/>
      <stop offset="0.55" stop-color="#9d431f"/>
      <stop offset="1" stop-color="#5c2712"/>
    </linearGradient>
    <clipPath id="rg-badge-clip">
      <path d="M18 4 H46 A14 14 0 0 1 60 18 V46 A14 14 0 0 1 46 60 H18 A14 14 0 0 1 4 46 V18 A14 14 0 0 1 18 4 Z"/>
    </clipPath>
  </defs>

  <!-- Badge background -->
  <path d="M18 4 H46 A14 14 0 0 1 60 18 V46 A14 14 0 0 1 46 60 H18 A14 14 0 0 1 4 46 V18 A14 14 0 0 1 18 4 Z" fill="url(#rg-grad)"/>

  <g clip-path="url(#rg-badge-clip)">
    <!-- Dynamic diagonal accent sweeping behind the house -->
    <rect x="-14" y="8" width="92" height="12" rx="6" fill="#ffffff" opacity="0.14" transform="rotate(-32 32 32)"/>
    <rect x="-14" y="44" width="92" height="7" rx="3.5" fill="#ffffff" opacity="0.10" transform="rotate(-32 32 32)"/>

    <!-- Modern single-slope house silhouette -->
    <path d="M15 49 L15 27 L34 14 L49 21.5 L49 49 Z" fill="#ffffff"/>

    <!-- Roofline accent -->
    <path d="M15 27 L34 14 L49 21.5 L49 25.5 L34 18 L15 31 Z" fill="#5c2712" opacity="0.85"/>

    <!-- Door, cut through to badge gradient -->
    <rect x="30" y="35" width="10" height="14" rx="2" fill="url(#rg-grad)"/>

    <!-- Window accent -->
    <rect x="19" y="33" width="8" height="8" rx="1.5" fill="#f2a65a"/>
  </g>
</svg>
